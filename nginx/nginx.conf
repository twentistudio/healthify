events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    # TLS diterminasi di proxy terluar, jadi $scheme di dalam container selalu
    # "http" dan Django membentuk URL http:// pada halaman https://.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~*^(https|http)$" $http_x_forwarded_proto;
    }

    # ragai.twenti.studio — engine publik. Hanya engine dan dokumentasinya;
    # SPA Healthify, verifikasi klaim, dan admin tidak dijangkau dari sini.
    server {
        listen 80;
        server_name ragai.twenti.studio;

        client_max_body_size 10M;

        # Halaman muka, dokumentasi, dan spesifikasi.
        location = / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location ~ ^/docs/?$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Engine. Hanya prefix ini, bukan seluruh /api/.
        location /api/v1/intelligence/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Selain di atas, tidak ada apa pun di domain ini.
        location / {
            return 404;
        }
    }

    # `default_server` wajib: nginx memakai blok pertama sebagai default bila
    # tidak ada yang ditandai, dan `server_name _` tidak pernah cocok dengan
    # Host sungguhan. Tanpa ini permintaan Healthify jatuh ke blok ragai.
    server {
        listen 80 default_server;
        server_name _;

        client_max_body_size 100M;

        root /app/frontend/dist;
        index index.html;

        # Django REST API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # Dokumentasi pindah ke domain publiknya. Tautan lama diarahkan, bukan
        # digandakan: dua salinan pasti berbeda isinya cepat atau lambat.
        location ~ ^/docs/?$ {
            return 301 https://ragai.twenti.studio/docs;
        }

        location = /openapi.json {
            return 301 https://ragai.twenti.studio/openapi.json;
        }

        # Django collected static (admin assets, etc.)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Uploaded media
        location /media/ {
            alias /app/media/;
            expires 30d;
        }

        # SPA frontend (React Router menangani rute di sisi klien)
        location / {
            try_files $uri /index.html;
        }
    }
}
