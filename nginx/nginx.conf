events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream backend {
        server backend:8000;
    }

    # TLS diterminasi di reverse proxy paling luar, sehingga $scheme di dalam
    # container ini selalu "http". Meneruskan nilai itu apa adanya membuat Django
    # membentuk URL http:// pada halaman https:// -> diblokir sebagai Mixed Content.
    # Pakai nilai dari proxy luar bila ada, jatuh ke $scheme bila tidak.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        "~*^(https|http)$" $http_x_forwarded_proto;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 100M;

        root /app/frontend/dist;
        index index.html;

        # Django REST API
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_connect_timeout 60s;
            proxy_send_timeout 180s;
            proxy_read_timeout 180s;
        }

        # Dokumentasi API eksternal (Scalar) — dilayani Django, bukan SPA.
        # Alias /api/docs dan /api/openapi.json sudah tercakup blok /api/ di atas.
        location ~ ^/docs/?$ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        location = /openapi.json {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Django collected static (admin assets, etc.)
        location /static/ {
            alias /app/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # Uploaded media
        location /media/ {
            alias /app/media/;
            expires 30d;
        }

        # SPA frontend (React Router menangani rute di sisi klien)
        location / {
            try_files $uri /index.html;
        }
    }
}
