services:
  db:
    image: pgvector/pgvector:pg16
    container_name: healtify_db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - healtify_network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: healtify_backend
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - FRONTEND_URL=https://healthify.twenti.studio
    volumes:
      - ./training/.env:/app/training/.env:ro
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    depends_on:
      - db
    networks:
      - healtify_network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: healtify_nginx
    ports:
      - "127.0.0.1:8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/app/frontend/dist:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - backend
    networks:
      - healtify_network
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  healtify_network:
    driver: bridge
