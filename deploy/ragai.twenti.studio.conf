# Blok vhost untuk engine publik ragai.
#
# DIPASANG DI PROXY TERDEPAN, bukan di nginx stack ini:
#   /home/client-twenti/sim-maggot-balkot/docker/nginx/production.conf
#
# Ditulis mengikuti pola blok healthify.twenti.studio yang sudah ada di berkas
# itu: tujuan proxy, resolver, dan header yang sama.
#
# Urutan pemasangan penting. Blok :443 menunjuk berkas sertifikat yang belum
# ada, dan nginx menolak start bila berkas itu tidak ditemukan. Karena itu:
#
#   1) tambahkan blok :80 saja, lalu muat ulang proxy
#   2) terbitkan sertifikat (perintah di bawah)
#   3) tambahkan blok :443, muat ulang lagi
#
# ---------------------------------------------------------------------------
# Langkah 2 — menerbitkan sertifikat, memakai volume milik proxy:
#
#   docker run --rm \
#     -v sim-rumah-maggot_letsencrypt:/etc/letsencrypt \
#     -v sim-rumah-maggot_certbot_www:/var/www/certbot \
#     certbot/certbot certonly --webroot -w /var/www/certbot \
#     -d ragai.twenti.studio --agree-tos -m twentistudio@gmail.com --no-eff-email
#
# Menerapkan tanpa membangun ulang proxy (agar domain lain tidak terganggu):
#
#   docker cp docker/nginx/production.conf sim-rumah-maggot-web-1:/etc/nginx/conf.d/default.conf
#   docker exec sim-rumah-maggot-web-1 nginx -t
#   docker exec sim-rumah-maggot-web-1 nginx -s reload
#
# Perubahan tetap harus ada di production.conf, karena berkas itu ikut di dalam
# image: tanpa itu, blok ini hilang pada rebuild berikutnya dan ragai kembali
# jatuh ke server default.
# ---------------------------------------------------------------------------

# ---- ragai.twenti.studio -> Healtify engine publik (healtify_nginx:80) ----
server {
    listen 80;
    server_name ragai.twenti.studio;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name ragai.twenti.studio;
    charset utf-8;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/ragai.twenti.studio/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ragai.twenti.studio/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $up_ragai healtify_nginx:80;

    location / {
        proxy_pass http://$up_ragai;
        proxy_http_version 1.1;

        # Host diteruskan apa adanya. Nginx di dalam stack memilih blok server
        # dari nilai ini; menggantinya membuat pengunjung ragai justru menerima
        # aplikasi Healthify.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
